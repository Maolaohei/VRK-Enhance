## Settings file was created by plugin VRK Texture Plus v1.3.0
## Plugin GUID: vrk.texplus

[Debug]

## 输出每轮扫描统计。
# Setting type: Boolean
# Default value: false
Verbose = false

[Scan]

## 每隔多少秒重新扫一遍贴图(新场景/新角色加载后自动补)。0 = 只在场景加载时扫(推荐)。
## 大于 0 会周期性调用 Resources.FindObjectsOfTypeAll 做全堆枚举, 每次都是一个 GC 尖峰, 会拖累 1% low。
# Setting type: Single
# Default value: 0
RescanSeconds = 0

## 分帧扇扫预算: 每帧最多处理多少张贴图。设成 48 可以把单帧 15ms 的扫描尖峰摊平到十几帧。
# Setting type: Int32
# Default value: 48
PerFrame = 48

[Texture]

## 强制 masterTextureLimit=0 与 anisotropicFiltering=ForceEnable（游戏默认就是这两项，插件用于防止被其它插件降档）。
# Setting type: Boolean
# Default value: true
FullResolution = true

## 把每张贴图的 anisoLevel 提到该值(1~16)。游戏原始贴图多为 1, 斜视时会糊成一片; 16 = 最锐。
# Setting type: Int32
# Default value: 16
AnisoLevel = 16

## Bilinear 过滤改写为 Trilinear(过渡更顺)。
# Setting type: Boolean
# Default value: true
ForceTrilinear = true

## mipMapBias: 负数=更锐(如 -1), 0=不动。过大负值会闪烁, 建议 -0.5 ~ -1。
# Setting type: Single
# Default value: 0
MipMapBias = 0

