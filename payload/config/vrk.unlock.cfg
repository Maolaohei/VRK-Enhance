## Settings file was created by plugin VRK Unlock All v1.0.0
## Plugin GUID: vrk.unlock

[Unlock]

## Master switch. true = unlock everything on the title screen.
# Setting type: Boolean
# Default value: true
Enabled = true

## Call the game own ALLClearData(): flags + play counters + story / interactive / pose tables.
# Setting type: Boolean
# Default value: true
UnlockAll = true

## When UnlockAll = false, unlock the story table only (ALLScenarioData).
# Setting type: Boolean
# Default value: true
UnlockStory = true

## When UnlockAll = false, unlock the interactive table only.
# Setting type: Boolean
# Default value: true
UnlockInteractive = true

## When UnlockAll = false, unlock the lesson list only.
# Setting type: Boolean
# Default value: true
UnlockLessons = true

## Write the save right away instead of waiting for the title screen.
# Setting type: Boolean
# Default value: true
FlushToDisk = true

## Retry interval in seconds while the save object is not ready yet.
# Setting type: Single
# Default value: 2
RetrySeconds = 2

## Give up after this many attempts.
# Setting type: Int32
# Default value: 30
MaxAttempts = 30

## Log each step.
# Setting type: Boolean
# Default value: false
Verbose = false
