## Settings file was created by plugin VRK Flat Mode + FPS Keys v1.41.0
## Plugin GUID: vrk.flatfps

[Camera]

## 无鼠标按键时直接用鼠标移动视角(FPS 习惯)。关掉则维持原版:按住左键拖动才转视角。
# Setting type: Boolean
# Default value: true
FreeLook = true

## 鼠标速度(类似 DPI 的数值量级, 越大越快)。500 ≈ 每 100 像素转 10°, 800 ≈ 16°, 1200 ≈ 24°。原版的 0.12 实际只有约 1.2°/100px, 点一下手的角度都不够。
# Setting type: Int32
# Default value: 800
MouseSpeed = 800

## 反转纵向视角。
# Setting type: Boolean
# Default value: false
InvertY = false

## 菜单/加载场景里冻结 IllusionCamera 并把相机复位到头部原点。免VR 时 IllusionCamera 每帧 transform.position = CalcPos()（focus 前方 distance=1.5 米），而 Title 等菜单是绕着玩家原点摆的 VR 界面 -> 相机一移走，菜单就整片出画，只剩背景渐变。
# Setting type: Boolean
# Default value: true
MenuSceneCameraFix = true

## 只有这些场景才允许 IllusionCamera 移动相机；其余场景（Init/Init2/Logo/Logo2/Attention/Title/VK_Adv? 等）一律按菜单处理。逗号分隔。
# Setting type: String
# Default value: Interactive,DressRoom,TrueLesson,Route,InteractiveRoute,VR_Houshi,VR_Sonyu,kiss,aibu,3rd,MainTutorial,Ending,beforeAibu,beforeHoushi,beforeSonyu,beforeKiss,PhotoRoom,CharaViewer,VK_Adv,VK_Adv_Bathroom,BathRoom
GameScenes = Interactive,DressRoom,TrueLesson,Route,InteractiveRoute,VR_Houshi,VR_Sonyu,kiss,aibu,3rd,MainTutorial,Ending,beforeAibu,beforeHoushi,beforeSonyu,beforeKiss,PhotoRoom,CharaViewer,VK_Adv,VK_Adv_Bathroom,BathRoom

## v1.27.0 第一人称把左右转向写到 CameraRig 根节点(而不是相机局部), 这样游戏按 rig 朝向摆的菜单/UI 会跟着你的视角走; 上下俯仰仍留在相机上, 菜单不会被掰歪.
# Setting type: Boolean
# Default value: true
FirstPersonRotateRig = true

## v1.23.0 游戏自带的“注视/触摸判定”原本只有 2 米(PlayerLookingCheck.raycastDis)。
## 第三人称下相机退到角色身后 1.5 米, 2 米就够不到人, 这里放宽到 3.5 米(2~10 可调)。
# Setting type: Single
# Default value: 3.5
LookDistance = 3.5

## 开关：允许用热键在第一/第三人称之间切换。
# Setting type: Boolean
# Default value: true
ViewToggle = true

## 切换视角的按键（KeyCode 名，默认 F）。
# Setting type: String
# Default value: F
ViewToggleKey = F

## 第一人称时相机距离焦点的值（越小越贴脸，0.02~0.1）。
# Setting type: Single
# Default value: 0.05
FirstPersonDistance = 0.05

## 第一人称下 WASD 行走速度（米/秒），按住 Shift 乘 FreeSprintMultiplier。
# Setting type: Single
# Default value: 2
FirstPersonMoveSpeed = 2

## 自由视角的移动速度（米/秒），按住 Shift 乘 FreeSprintMultiplier。
# Setting type: Single
# Default value: 3
FreeMoveSpeed = 3

## 自由视角下按住 Shift 的倍率。
# Setting type: Single
# Default value: 3
FreeSprintMultiplier = 3

## 第三人称恢复时的距离（原版默认 1.5）。
# Setting type: Single
# Default value: 1.5
ThirdPersonDistance = 1.5

## 免VR 时把相机抬到站立眼高。游戏在 FloorLevel 追踪原点下把 CameraRig 的 Y 强制写成 0（Manager.Scene.SetCameraRigPos: DefPos_ = new Vector3(pos_.x, 0f, pos_.z)），真机时由头显位姿补上 1.6 米；没有头显就是 0 米，相机卡在地板里，房间地板被剔除、只剩巨大的室外地面球(道具 props/tamatama/tama, 包围盒 32x24x32 米)铺满下半屏。
# Setting type: Boolean
# Default value: true
EyeHeightEnabled = true

## 站立眼高(米)。写入 OVRCameraRig.trackingSpace.localPosition.y，OVRCameraRig.UpdateAnchors 会据此把眼睛摆到该高度。
# Setting type: Single
# Default value: 1.28
EyeHeight = 1.28

## 把游戏自带的凝视射线(VREyeRaycaster / BodyTouchManager / InteractiveLookingStatus) 的起点对齐到真正渲染的眼位。关掉就回到原版行为。
# Setting type: Boolean
# Default value: true
SyncGameGazeCamera = true

## 游戏 InteractiveLookingStatus 的注视判定距离(原版 2m)。第三人称相机退到 1.5m 之后, 2m 很容易够不到目标。
# Setting type: Single
# Default value: 3.5
GazeLookDistance = 3.5

[Debug]

## 输出详细诊断日志。
# Setting type: Boolean
# Default value: false
Verbose = false

[Diagnostics]

## 单帧耗时超过该秒数就记一条 long frame 日志，用来定位“长时间未响应”卡在哪一帧。0 = 关闭。
# Setting type: Single
# Default value: 1.5
FrameGapSeconds = 1.5

## 打印「准星命中点 vs 游戏相机命中点」的对照日志, 用于确认触发点偏移。
# Setting type: Boolean
# Default value: true
GazeAimLog = true

## v1.21.0 正片场景里每次左键都记一行: 射线命中了谁/命中物体上有哪些组件/EventSystem 状态。
## 用来定位“有时候无法和女主交互”: 点不动的那次对比正常那次的输出就行。不需要时改 false 关掉。
# Setting type: Boolean
# Default value: false
InteractionLog = false

## v1.22.0 每秒打一行光环位置/距离/命中物, 用来证明它在动。
# Setting type: Boolean
# Default value: false
GazeRingLog = false

## 按这个键立即输出一份完整渲染清单 (Graphic + Renderer + Canvas)。
# Setting type: String
# Default value: F10
DumpKey = F10

## 进入游戏场景后自动探测屏幕正中央的物体（打一行日志，方便定位不明物体）。
# Setting type: Boolean
# Default value: true
CenterProbe = true

## 目标场景进入后多少秒做一次中心探测。
# Setting type: Single
# Default value: 4
ProbeDelay = 4

## 进入正式场景后把渲染结果存成 PNG(游戏根目录 vrk_frame_*.png), 用于白屏取证。
# Setting type: Boolean
# Default value: false
SaveFrames = false

## 最多存几张取证图(每场景最多1张)。
# Setting type: Int32
# Default value: 3
MaxShots = 3

[Fade]

## 看门狗: 淡入淡出卡死时强制清屏(修复白屏)。
# Setting type: Boolean
# Default value: true
RepairStuckFade = true

## IsFading=true 且 Alpha 连续N秒不变 -> 判定协程已死, 强制清除遮罩。
# Setting type: Single
# Default value: 2
StuckFadeSeconds = 2

## Alpha 全白/全不透明且同一场景停留N秒 -> 判定卡在遮罩后, 强制清除。
# Setting type: Single
# Default value: 8
CoveredSceneSeconds = 8

## 同一遮罩被修复后仍在N秒内重新盖住屏幕 -> 直接停用整个 Fade 面板(彻底根治白屏)。0=不停用。
# Setting type: Single
# Default value: 3
HardKillSeconds = 3

## VRCameraFade.Awake 后把遮罩面板 alpha 清零(面板序列化颜色是纯白 alpha=1, 而 FadeInOnStart/FadeInOnSceneLoad 都是 false -> 不擦就永久白屏)。
# Setting type: Boolean
# Default value: true
ClearPanelOnAwake = true

[General]

## 在 InitScene2.CheckHMD 直接返回 true 并把 GlobalVRKanojo.ForceMouse_ 置真，不依赖 VRDevice。
# Setting type: Boolean
# Default value: true
ForceFlatMode = true

## 锁定鼠标指针(VR 平面模式用中心准星选 UI)。按住 CursorHoldKey 可临时释放。
# Setting type: Boolean
# Default value: true
LockCursor = true

## 按住即释放鼠标指针的按键(KeyCode 名称, 逗号分隔多个)。松手自动重新锁定。留空=永不释放。
# Setting type: String
# Default value: LeftAlt,RightAlt
CursorHoldKey = LeftAlt,RightAlt

[Help]

## 进入游戏(离开初始化/Logo 场景)后自动显示右上角操作指南。任何时候按 Hotkey 可显示/隐藏。
# Setting type: Boolean
# Default value: true
ShowOnStart = true

## 自动显示后多少秒自动隐藏。0 = 一直显示(等同 ShowOnStart+不隐藏)。
# Setting type: Single
# Default value: 5
AutoHideSeconds = 5

## 显示/隐藏操作指南的按键(KeyCode 名称, 如 F7 / H / F1)。留空 = 禁用。
# Setting type: String
# Default value: F7
Hotkey = F7

## 操作指南缩放(0.6 ~ 2.0)。默认字号按分辨率自动换算, 面板宽度随文字自适应。
# Setting type: Single
# Default value: 1
Scale = 1

[Input]

## v1.21.0 默认关闭。开启时会在菜单场景建一套 EventSystem/GraphicRaycaster 桥(旧 v1.8.0 方案)。
## 直连点击(v1.9.0) 与物理点击(v1.13.0) 已经不依赖它, 而这套桥会让 EventSystem.current 被我们接管, 可能干扰游戏自己的悬停/点击判定。
# Setting type: Boolean
# Default value: false
LegacyUiBridge = false

## v1.23.0 交互键。按住它 = 游戏原生的“决定/触摸”(等价于按住鼠标左键), 但不会像左键那样同时拖动镜头。
## 空字符串 = 关闭。可填 E / F / Q / Space 等 KeyCode 名。
# Setting type: String
# Default value: E
InteractKey = E

## v1.24.0 注视触摸的抓取距离。游戏在 BodyTouchManager.CheckGazeTouch 里硬编码了 1.5 米:
## 相机离女主超过 1.5 米就抓不到(第三人称恰好卡在边界), 所以改成可调。
## 默认 2.5 米, 合理范围 1~10。
# Setting type: Single
# Default value: 2.5
GazeGrabDistance = 2.5

## v1.26.0 游戏里 controlType==0 才代表键鼠模式. 现在是 1(VR 手柄), 于是 BodyTouchManager.Update_GazeCaress 与 CheckGazeTouch 整条凝视触摸链都被跳过, 按 E 也没反应. 打开后插件在每次进入场景时把 controlType 写成 0.
# Setting type: Boolean
# Default value: true
ForceNonController = true

## v1.26.0 BodyTouchManager 上的 enableGaze 是场景里序列化的开关, 默认关着. 打开后插件每进一个场景就把它置 true, 让凝视触摸真正生效.
# Setting type: Boolean
# Default value: true
ForceEnableGaze = true

## 免VR 时把左键当成右手: 射线命中可抓取物就 GrabBegin, 松开 ForceRelease。
# Setting type: Boolean
# Default value: true
MouseHandGrab = true

## 把游戏窗口的输入法上下文摘掉, 中文输入法不再吃掉 WASD。
# Setting type: Boolean
# Default value: true
DisableIme = true

## 按住左键时把游戏的 Hand 瞬移到准星命中点, 让手部碰撞体真正压上去(HandPad 这类靠 OnTriggerEnter 的才能响应)。
# Setting type: Boolean
# Default value: true
MouseHandTeleport = true

## 鼠标当手时的射线长度(米)。
# Setting type: Single
# Default value: 5
MouseHandReach = 5

## 左键直接调游戏自带的凝视交互(BodyTouchManager.CheckGazeTouch)。女主身上发光的部位只能走这条路才会真正被抓住。
# Setting type: Boolean
# Default value: true
MouseBodyCaress = true

## 打印鼠标手瞄准/抓取的详细日志（调试用）。
# Setting type: Boolean
# Default value: false
MouseHandLog = false

## 左键命中后, 若对象不是 uGUI, 则调用游戏的 InteractiveProc(碰撞体名) —— 等价于 VR 手贴上去的反应。
# Setting type: Boolean
# Default value: true
ClickProc = true

## 左键命中 VRInteractiveItem 时直接触发它的 Down/Click/Up 事件(游戏图标都走这条)。
# Setting type: Boolean
# Default value: false
ClickVRItem = false

## uGUI 指针坐标空间: Auto / Screen / Render。RenderScale(渲染缩放) 下相机渲染到更小的离屏目标, 所有 ScreenPointToRay / GraphicRaycaster 都按目标像素计算。Auto = 画面不是 ScreenSpaceOverlay 时用 Render 空间。
# Setting type: String
# Default value: Auto
UiPointerSpace = Auto

## 正片场景里也允许直连点击（平板菜单这类世界空间 UI 只能这样点）。
# Setting type: Boolean
# Default value: true
ClickInGame = true

## 开启物理射线点击：对准 3D 物体（如平板菜单）也能触发 Button / IPointerClickHandler。
# Setting type: Boolean
# Default value: true
PhysicsClick = true

## 不拆游戏自带的 OVRInputModule / OVRRaycaster（它们是游戏菜单的原生输入链路）。
# Setting type: Boolean
# Default value: true
KeepOvrInput = true

## 免VR 菜单鼠标点击桥。Title 等菜单只用 OVRRaycaster（从 VR 射线指针发射），没有头显时鼠标点不到按钮。开启后会给每个世界空间 Canvas 补 GraphicRaycaster、把 OVRRaycaster 停用，并保证 EventSystem 上有 StandaloneInputModule。
# Setting type: Boolean
# Default value: true
FlatUiInput = true

## 菜单/加载场景是否锁定鼠标指针。false=菜单里指针始终可见可移动（能点按钮），true=像正片一样锁在屏幕中心。
# Setting type: Boolean
# Default value: false
MenuCursorLock = false

## 免VR 直连点击：菜单里按下左键时，直接计算光标落在哪个 Button 上并调用它的 onClick，完全不依赖 EventSystem/GraphicRaycaster/OVRRaycaster 这条链。上一版只补了 raycaster 仍然点不动，说明链上有别的东西在吞点击（例如 order=32767 的全屏 Fader 面板），所以这里绕过整条链。
# Setting type: Boolean
# Default value: true
DirectMenuClick = true

## 把每次点击尝试的结果写进日志：命中的按钮路径、或被挡在哪个 Graphic 上、或压根没命中。确认能点之后可以关掉。
# Setting type: Boolean
# Default value: false
ClickDebug = false

[Keys]

## 方向键 -> WASD: Up=W Down=S Left=A Right=D。小键盘(旋转/升降)与括号/FOV 键不变。
# Setting type: Boolean
# Default value: true
UseFpsKeys = true

[Visual]

## 屏幕中心准星(从 旧版 Play Without VR 插件里拿回来的图标: 红色圆环 + 四个刻度。
## 开关影响免VR 模式; VR 模式下由头显准星代替。
# Setting type: Boolean
# Default value: true
Crosshair = false

## 准星直径(像素, 按 1440p 为基准随分辨率缩放): 40 = 小, 56 = 适中, 80 = 大。
# Setting type: Int32
# Default value: 56
CrosshairSize = 56

## 准星不透明度 0-1。
# Setting type: Single
# Default value: 0.85
CrosshairAlpha = 0.85

## true = 只在第一人称显示准星; false = 第三人称/自由视角也显示。
# Setting type: Boolean
# Default value: false
CrosshairFirstPersonOnly = false

## v1.23.0 准星对准可交互物(女主身体/可碰道具)时, 屏幕中心画四角方框 + “E 交互”提示。
## 光环(GazeRingMode=Aim)会同时放大 20%。不喜欢改 false。
# Setting type: Boolean
# Default value: true
HoverReticle = true

## 凝视光环常显: 没瞄准任何可交互东西时也把它固定在视线正中; 瞄中按钮时仍然从游戏原生逻辑拿到放大/进度反馈。
## true = 常显(推荐, 相当于免VR 下的准星), false = 完全交给游戏(只在可交互物体上出现)。
# Setting type: Boolean
# Default value: true
AlwaysShowGazeRing = true

## v1.22.0 光环定位方式。Aim = 每帧从相机射线打一条物理射线, 光环贴在命中点上(跟着你看的东西走); Center = 固定在屏幕正中心 GazeRingDistance 米处。
# Setting type: String
# Default value: Aim
GazeRingMode = Aim

## v1.22.0 Aim 模式下射线的最大长度(米)。超过这个距离没命中就回到屏幕中心。v1.25.0 默认从 2.5 放宽到 8。
# Setting type: Single
# Default value: 8
GazeRingMaxDistance = 8

## v1.25.0 关闭时: 视线没打到任何东西, 光环会挂在相机正前方 1.5 米处 —— 看上去就像个钉在画面中央、相机转它也不动的假准星。开启(默认)后这种时候直接隐藏光环, 只有真的贴到物体表面时才显示。
# Setting type: Boolean
# Default value: true
GazeRingHideWhenNoHit = true

## 光环常显时离眼睛的距离(米) 0.5-4: 太近会遮手, 太远会变得很大。光环会按距离等比缩放, 视角尺寸恒定。
# Setting type: Single
# Default value: 1.5
GazeRingDistance = 1.5

## 免 VR 时隐藏凝视光环 (VRKanojo_GazePointerRing)。它是 VR 头显凝视游标，无头显时会像个物体挂在屏幕正中央。
# Setting type: Boolean
# Default value: false
HideGazeRing = false

