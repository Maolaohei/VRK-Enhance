## Settings file was created by plugin VRK Unlock All v1.0.0
## Plugin GUID: vrk.unlock

[Unlock]

## 总开关。true = 启动后自动解锁全部内容（只做一次，结果写进存档）。
# Setting type: Boolean
Default value: true
Enabled = true

## 调用游戏自带的 ALLClearData()：剧情 + 互动 + 体位表 + 结局标记，一次全给。
# Setting type: Boolean
Default value: true
UnlockAll = true

## UnlockAll=false 时，单独解锁剧情（ALLScenarioData）。
# Setting type: Boolean
Default value: true
UnlockStory = true

## UnlockAll=false 时，单独解锁互动（ALLInteraciveData，游戏里就是这么拼的）。
# Setting type: Boolean
Default value: true
UnlockInteractive = true

## UnlockAll=false 时，单独补 allHInfo（体位/爱抚计数表）。
# Setting type: Boolean
Default value: true
UnlockLessons = true

## 解锁后立刻调用 Game.Save() 写回 UserData/save/save.dat。
# Setting type: Boolean
Default value: true
FlushToDisk = true

## 没找到 Game 单例时多久重试一次（秒）。
# Setting type: Single
Default value: 2
RetrySeconds = 2

## 最多重试多少次，防止在菜单外空转。
# Setting type: Int32
Default value: 30
MaxAttempts = 30

[Debug]

## 打印每次重试的详细状态。
# Setting type: Boolean
Default value: false
Verbose = false
