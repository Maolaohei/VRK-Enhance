## Settings file was created by plugin VRK Perf (no visual loss) v1.1.0
## Plugin GUID: vrk.perf

[Compatibility]

## 把 OVRManager.useRecommendedMSAALevel 关掉。
## 无头显时 OVRManager.Update 每帧都会比较 QualitySettings.antiAliasing 与 display.recommendedMSAALevel,
## 不一致就 Debug.Log 并强制改写 MSAA —— 既可能把画质档的 4x MSAA 悄悄降成 0, 又可能每帧刷日志吃 CPU。
## 关掉后游戏自己的抗锯齿设置说了算(纯反射, 不使用 Harmony, 不修改任何方法体)。
# Setting type: Boolean
# Default value: true
PinOvrRecommendedMsaa = true

[Diagnostics]

## 每个场景打印一次启用的相机清单(只写日志, 不改变行为)。用于确认没有多余相机在重复渲染。
# Setting type: Boolean
# Default value: false
CameraReport = false

## 打印每次设置的生效结果。
# Setting type: Boolean
# Default value: false
Verbose = false

[Frame]

## 垂直同步覆盖: -1 = 不改动游戏设置, 0 = 关闭(推荐), 1 = 开启, 2 = 隔帧。
## 240Hz 屏上 vSync=1 会在撑不住 240 时掉到 120 并产生节奏抖动, 关掉通常明显改善 1% low。
# Setting type: Int32
# Default value: 0
VSync = 0

## 帧率上限(仅在 VSync=0 时生效): -1 = 不改动, 0 = 不限制, 其它 = 上限。
## 撕裂明显时设成 刷新率-3(例如 237)或 120, 帧时间会更稳。
# Setting type: Int32
# Default value: 0
TargetFrameRate = 0

[Loading]

## 进入加载/淡出场景时主动 GC.Collect(), 把全停顿回收挪到看不见的时候。
## 游戏过程中不做任何强制回收。
# Setting type: Boolean
# Default value: true
GcOnSceneLoad = true

## 加载屏期间把 Application.backgroundLoadingPriority 提到 High, 游戏内降回 Low。
# Setting type: Boolean
# Default value: true
ManagedLoadingPriority = true

