## Settings file was created by plugin VRK UpScale (FSR1 EASU+RCAS) v1.7.0
## Plugin GUID: vrk.upscale

[Debug]

## Log one line per pipeline state change.
# Setting type: Boolean
# Default value: false
Verbose = false

## Key that writes a status report to the log. Empty string disables it.
# Setting type: String
# Default value: F9
StatusKey = F9

[General]

## Turn the whole effect on. When false nothing is loaded and rendering is untouched.
# Setting type: Boolean
# Default value: true
Enabled = true

## Sharpen = RCAS only at native resolution (safe). RenderScale = render below native and upscale via EASU.
# Setting type: String
# Default value: Sharpen
Mode = RenderScale

## RCAS sharpness, 0 = softest, 1 = sharpest. FSR default is 0.2.
# Setting type: Single
# Default value: 0.2
Sharpness = 0.2

## false = skip the native FSR pass entirely and just bilinear-blit. Diagnostic switch: if the heap-corruption crash disappears with this off, the native pass is the trigger.
# Setting type: Boolean
# Default value: true
NativePass = false

## Only used by RenderScale: target width. 0 = current screen width.
# Setting type: Int32
# Default value: 0
OutputWidth = 0

[RenderScale]

## Only used by RenderScale mode: fraction of the screen the scene is rendered at (0.25 - 1.0).
# Setting type: Single
# Default value: 0.75
Scale = 0.85

[Safety]

## 每 N 秒用 Graphics.Blit 先把未处理帧写进目标，保证原生层失效时画面也不会空白。0 = 关闭。
# Setting type: Single
# Default value: 5
SanitySeconds = 5

