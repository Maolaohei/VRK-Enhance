## Settings file was created by plugin VRK PreWarm (shader / material / texture) v1.1.1
## Plugin GUID: vrk.prewarm

[Debug]

## Log per phase details instead of one summary line per scene.
# Setting type: Boolean
# Default value: false
Verbose = false

[PreWarm]

## Master switch. When false the runtime object is never created.
# Setting type: Boolean
# Default value: true
Enabled = true

## Call Shader.WarmupAllShaders() once per session (biggest win, biggest single cost).
# Setting type: Boolean
# Default value: false
WarmShaders = false

## Run Material.SetPass(0) over every loaded material so its variant is compiled up front.
# Setting type: Boolean
# Default value: true
WarmMaterials = true

## Touch GetNativeTexturePtr() on every Texture2D to force the VRAM upload.
# Setting type: Boolean
# Default value: true
WarmTextures = true

## Skip the logo / loading scenes (Init, Init2, CheckHMD, SetHMD, Logo2, Logo, Attention). Leave this false so the shader warmup happens behind the loading screen.
# Setting type: Boolean
# Default value: false
SkipLoadingScenes = false

## Milliseconds of warming allowed per frame before yielding.
# Setting type: Single
# Default value: 6
FrameBudgetMs = 6

## Milliseconds of warming allowed per scene before giving up.
# Setting type: Single
# Default value: 2000
TotalBudgetMs = 2000

